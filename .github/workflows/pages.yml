name: Deploy Public Level Editor

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'styles.css'
      - 'github-publish.css'
      - 'levels.json'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/src
          cp index.html styles.css github-publish.css levels.json _site/
          cp src/*.mjs _site/src/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/src/app.mjs
          test -f _site/src/github-publish-ui.mjs
          python3 -m json.tool _site/levels.json > /dev/null
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
